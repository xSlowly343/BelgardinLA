<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Belgardin Cheat Sheet</title>
<meta name="description" content="Шпаргалка по Shadow Raid Belgardin (Lost Ark): механики HP-полос обоих врат на одной картинке. RU · EN · 中文.">
<meta name="author" content="xSlowly">
<meta name="theme-color" content="#d4a85a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Golos+Text:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0b10;--panel:#17141c;--panel2:#1e1a24;--line:#2f2a37;
  --ink:#ece5d7;--muted:#a39b8f;--dim:#776f80;
  --gold:#d4a85a;--rose:#e2a6b4;
  --g1:#a98bff;--g1b:#5f4aa8;--g2:#e0614f;--g2b:#8e2f2a;
  --jg:#f2d15c;--ct:#5fc6ff;--death:#ff5f73;--safe:#66d29e;--grab:#c08cff;--hm:#f2994a;
  --fd:'Oswald','Noto Sans SC','Noto Sans CJK SC',sans-serif;
  --fb:'Golos Text','Noto Sans SC','Noto Sans CJK SC',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--fb);-webkit-font-smoothing:antialiased}
html[lang=zh-CN] body{--fb:'Noto Sans SC','Noto Sans CJK SC',system-ui,sans-serif}

/* ---------- toolbar (hidden when rendering PNG) ---------- */
.bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;
  padding:10px 16px;background:rgba(13,11,16,.92);border-bottom:1px solid var(--line);font:500 14px var(--fb)}
.bar a,.bar button{color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;
  font:inherit;cursor:pointer;text-decoration:none}
.bar button[aria-pressed=true]{background:var(--gold);color:#1a1408;border-color:var(--gold)}
.bar .sp{flex:0 0 12px}
html.print .bar{display:none}
.wrap{overflow:auto}

/* ---------- sheet ---------- */
.sheet{position:relative;width:2400px;margin:0 auto;padding:30px 44px 26px;overflow:hidden;
  background:
   radial-gradient(1200px 700px at 50% -10%,rgba(169,139,255,.10),transparent 60%),
   radial-gradient(900px 600px at 100% 0,rgba(224,97,79,.10),transparent 60%),
   linear-gradient(#141118,#0d0b10 40%)}
.sheet::before,.sheet::after{content:"";position:absolute;top:0;height:470px;width:900px;background-size:cover;opacity:.55;pointer-events:none}
.sheet::before{left:0;background-image:url(../img/boss/belgardin.jpg);background-position:30% 22%;
  -webkit-mask:linear-gradient(90deg,#000 10%,transparent 85%),linear-gradient(#000 35%,transparent);-webkit-mask-composite:source-in;mask-composite:intersect}
.sheet::after{right:0;background-image:url(../img/boss/phetus.jpg);background-position:60% 30%;
  -webkit-mask:linear-gradient(270deg,#000 10%,transparent 85%),linear-gradient(#000 35%,transparent);-webkit-mask-composite:source-in;mask-composite:intersect}
.sheet>*{position:relative;z-index:1}

.top{text-align:center;margin-bottom:6px}
.top .kick{font:500 15px var(--fd);letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.top h1{margin:2px 0 0;font:600 50px/1.05 var(--fd);letter-spacing:.02em;color:var(--rose);text-shadow:0 2px 24px rgba(0,0,0,.6)}
.top h1 b{color:var(--ink);font-weight:600}
.diffs{display:flex;justify-content:center;gap:16px;margin-top:14px}
.diff{display:flex;align-items:center;gap:12px;padding:8px 18px 8px 14px;border:1.5px solid;border-radius:10px;background:rgba(16,13,20,.78)}
.diff .ico{width:22px;height:22px;opacity:.9}
.diff .n{font:600 18px/1 var(--fd);letter-spacing:.06em;text-transform:uppercase}
.diff .il{font:600 28px/1 var(--fd);color:var(--ink)}
.diff .gd{font:500 14px/1.2 var(--fb);color:var(--muted);text-align:left;border-left:1px solid var(--line);padding-left:12px}
.diff .gd b{color:var(--gold);font-weight:600}
.d-n{border-color:#4fa3d8}.d-n .n{color:#5cb8f0}
.d-h{border-color:#d9773e}.d-h .n{color:#f08a4b}
.d-nm{border-color:#c057c8}.d-nm .n{color:#e070e8}

.gates{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:4px}
.ghead{display:flex;align-items:center;gap:22px;padding:6px 10px 0}
.g2 .ghead{flex-direction:row-reverse;text-align:right}
.gbadge{flex:none;width:104px;height:104px;display:grid;place-items:center;position:relative}
.gbadge::before{content:"";position:absolute;inset:14px;transform:rotate(45deg);border:2px solid var(--acc);background:rgba(20,17,25,.9);border-radius:6px;box-shadow:0 0 22px rgba(0,0,0,.6)}
.gbadge span{position:relative;text-align:center;font:600 30px/1 var(--fd)}
.gbadge small{display:block;font:500 15px/1.3 var(--fd);color:var(--muted);margin-top:3px}
.gname{font:600 36px/1.05 var(--fd);color:var(--gold);letter-spacing:.02em;text-transform:uppercase}
.gtags{font:500 19px/1.3 var(--fd);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.ghp{font:400 11.5px/1.4 var(--fb);color:var(--dim);margin-top:4px;display:flex;gap:14px}
.g2 .ghp{justify-content:flex-end}
.ghp i{font-style:normal;padding-left:8px;border-left:2px solid var(--acc2)}
.g1{--acc:var(--g1);--acc2:var(--g1b)}
.g2{--acc:var(--g2);--acc2:var(--g2b)}

.orn{display:flex;align-items:center;gap:0;margin:12px 0 10px}
.orn .ln{flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--acc) 30%,var(--acc) 70%,transparent);opacity:.55}
.orn .lbl{font:600 17px var(--fd);letter-spacing:.14em;text-transform:uppercase;padding:4px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);margin:0 14px;white-space:nowrap}
.orn .lbl em{font-style:normal;color:var(--acc)}
.orn .dia{width:16px;height:16px;transform:rotate(45deg);border:2px solid var(--acc);background:var(--bg);flex:none}

.items{display:grid;grid-template-columns:auto repeat(5,1fr);gap:8px;margin:0 0 12px;align-items:stretch}
.items .ih{display:flex;flex-direction:column;justify-content:center;padding:0 10px 0 4px;font:600 15px/1.15 var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.items .ih small{display:block;font:400 10.5px/1.3 var(--fb);letter-spacing:0;text-transform:none;color:var(--dim);margin-top:3px;max-width:110px}
.it{display:flex;gap:9px;align-items:center;padding:7px 9px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.it.opt{border-style:dashed}
.it .ic{flex:none;width:42px;height:42px;border-radius:7px;border:1.5px solid #8a6a52;background:#211b28;display:grid;place-items:center;overflow:hidden}
.it .ic img{width:100%;height:100%;object-fit:cover}
.it .ic svg{width:30px;height:30px}
.it b{display:block;font:600 12.8px/1.15 var(--fb);color:var(--ink)}
.it span{display:block;font:400 12px/1.3 var(--fb);color:var(--muted);margin-top:1px}
.it span em{font-style:normal;font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.col{position:relative;background:linear-gradient(180deg,var(--panel),#141118);border:1px solid var(--line);border-radius:26px;padding:22px 20px 14px 76px}
.col::before{content:"";position:absolute;left:36px;top:30px;bottom:28px;width:5px;border-radius:5px;
  background:linear-gradient(var(--acc),var(--acc2) 60%,rgba(0,0,0,0))}

.sec{position:relative;margin-bottom:20px}
.sec:last-child{margin-bottom:4px}
.num{position:absolute;color:var(--ink);left:-62px;top:-1px;min-width:50px;height:34px;padding:0 6px;display:grid;place-items:center;
  font:600 21px/1 var(--fd);color:var(--ink);background:#141118;border:2px solid var(--acc);border-radius:9px;box-shadow:0 0 0 4px #17141c}
.num svg{width:20px;height:20px}
.sec h3{margin:0 0 6px;font:500 25px/1.15 var(--fd);color:var(--ink);letter-spacing:.01em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h3 .ko{font:400 13px var(--fb);color:var(--dim);letter-spacing:0}
.sec h3 .tag{font:600 12px/1 var(--fb);letter-spacing:.04em;text-transform:uppercase;color:var(--acc);border:1px solid var(--acc);border-radius:5px;padding:3px 6px;align-self:center}
.lead{margin:0 0 4px;font:400 14px/1.4 var(--fb);color:var(--muted)}
.body{display:flex;gap:14px;align-items:flex-start}
.txt{flex:1;min-width:0}
.fig{flex:none;width:180px;display:flex;flex-direction:column;gap:8px}
.fig.w{width:225px}

ul{list-style:none;margin:0;padding:0}
li{position:relative;padding-left:14px;font:400 14.2px/1.4 var(--fb);color:#ddd5c8;margin:1px 0}
li::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--muted)}
li.hm{color:var(--hm);font-weight:600}
li.hm::before{background:var(--hm)}
li.st{color:var(--ink);font-weight:600;margin-top:5px;padding-left:0}
li.st::before{display:none}
li.st u{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
li ul{margin:1px 0 2px}
li li{padding-left:13px;font-size:13.6px}
li li::before{width:6px;height:1.5px;border-radius:0;top:.72em;background:var(--dim)}
li b{color:var(--ink);font-weight:600}
html[lang=zh-CN] li{font-size:14.4px;line-height:1.45}

j{color:var(--jg);font-weight:600}
k{color:var(--ct);font-weight:600}
x{color:var(--death);font-weight:600}
s{color:var(--safe);font-weight:600;text-decoration:none}
v{color:var(--grab);font-weight:600}
o{color:var(--hm);font-weight:600}

figure{margin:0;position:relative}
figure img{display:block;width:100%;border-radius:6px;border:1px solid #3a3443;aspect-ratio:16/10;object-fit:cover}
figure.tall img{aspect-ratio:4/3}
figcaption{font:500 11.5px/1.3 var(--fb);color:var(--muted);text-align:center;margin-top:3px}
figure .ov{position:absolute;left:6px;top:5px;font:600 11px var(--fb);background:rgba(10,8,12,.8);padding:2px 6px;border-radius:4px;color:var(--ink)}
.dg{display:block;width:100%;height:auto}
.dgrow{display:flex;gap:6px}
.dgrow figure{flex:1}

.foot{display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center;margin-top:16px;padding:12px 18px;border:1px solid var(--line);border-radius:14px;background:rgba(23,20,28,.8);font:400 12.5px/1.45 var(--fb);color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.foot .cr{text-align:right}
.foot .cr b{color:var(--gold);font-weight:600}
.foot .mid{text-align:center}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="wrap"><div class="sheet" id="sheet"></div></div>

<script>
"use strict";
/* Belgardin cheat sheet — content from the Grimoire (js/data.js + i18n-dict.js): Inven 110616/110652/110620/3976005, Arca 179073928/179011733.

const SUB=(head,items)=>Object.assign(head,{sub:items});

const UI={

  gold:L('золото','gold','金币'),

  g1place:L('Sanctuary of Holy Rest','Sanctuary of Holy Rest','圣息墓园'),
  g2name:L('Phetus an Kragma','Phetus an Kragma','佩图斯·安·克拉格玛'),

  credit:L('Гримуар Белгардина · <b>xSlowly</b> · xslowly343.github.io/BelgardinLA','Grimoire of Belgardin · <b>xSlowly</b> · xslowly343.github.io/BelgardinLA','贝尔加丁魔典 · <b>xSlowly</b> · xslowly343.github.io/BelgardinLA'),
  src:L('Источники: Inven, Arca.live (в т.ч. расходка), патчноут Lost Ark (KR, 5 авг 2026). Схемы сняты в основном на NM — на N/H отличия возможны.',
        'Sources: Inven, Arca.live (incl. battle items), Lost Ark patch notes (KR, Aug 5, 2026). Diagrams mostly from NM — N/H may differ.',
        '资料来源：Inven、Arca.live（含战斗道具）、失落的方舟更新公告（韩服，2026年8月5日）。示意图多为噩梦难度，普通/困难可能有差异。'),
  save:L('Скачать PNG','Download PNG','下载 PNG'),
  back:L('← К гримуару','← Back to the Grimoire','← 返回魔典'),
  fit:L('По ширине','Fit width','适应宽度'),
  full:L('1:1','1:1','1:1'),
};

/* ---------------- GATE I ---------------- */
const G1A=[
 {n:'fm',t:UI.fm,items:[
   ST('<u>Insight-атаки</u> (с 240)','<u>Insight attacks</u> (from 240)','<u>看破攻击</u>（240管起）'),
   L('Глитч экрана + фиолетовый пол = Insight','Screen glitch + purple floor = Insight','屏幕闪烁 + 紫色地面 = 看破'),
   SUB(L('Руки пустые → пробел <b>позже</b>, когда босс поднимает руку','Bare hands → spacebar <b>late</b>, as he raises his hand','空手 → 首领抬手时<b>稍晚</b>按空格'),[
     L('Внутри — <k>кооп-контра</k> (нужно 3+), провал — удар по всей арене','Inside — <k>co-op counter</k> (3+ needed); fail = arena-wide hit','内部——<k>协同反击</k>（需3人以上），失败则全场重击')]),
   SUB(L('Клинок в руке → пробел <b>сразу</b>','Blade in hand → spacebar <b>immediately</b>','手持利刃 → <b>立刻</b>按空格'),[
     L('Внутри <j>Holding JG</j>: зажать по стрелке, когда заливка почти полная','Inside: <j>Holding JG</j> along the arrow when the fill is almost full','内部：填充快满时按箭头方向<j>持续精准防御</j>'),
     L('Не вошёл — <x>почти смерть</x>: в центр, саппорт сразу даёт щит','Not inside = <x>near-death</x>: stack mid, support shields at once','没进去 = <x>几乎即死</x>：集合中间，辅助立刻开盾')]),
   HM('N/H — глаза вспыхивают красным; NM — только по анимации','N/H — eyes flash red; NM — animation only','普通/困难——眼睛红光提示；噩梦——只能看动作'),
   ST('<u>Прочее</u>','<u>Also</u>','<u>其他</u>'),
   L('<b>Medusa</b>: чёрный пол или чакрам <b>растёт</b> → <x>отвернись</x>','<b>Medusa</b>: black floor or chakram <b>grows</b> → <x>look away</x>','<b>美杜莎</b>：地面变黑或轮刃<b>变大</b> → <x>背对</x>'),

         {img:'../img/screens/medusa-1.jpg',cap:L('Medusa — отвернись','Medusa — look away','美杜莎——背对')}]},
 {n:'300',t:L('Пул','Pull','开怪'),items:[

   L('Бей <s>со спины</s>; фронт — только под щитом саппорта','Hit <s>from behind</s>; the front only under a support shield','<s>从背后</s>输出；正面只在辅助护盾下'),
 ]},
 {n:'240',t:L('Водоросли','Seaweed Tentacles','水草触手'),ko:'미역줄기',items:[
   L('Кат-сцена, по краю — вихрь <b>Necromancer’s Curse</b>','Cutscene, a <b>Necromancer’s Curse</b> vortex rises at the edge','过场动画，边缘升起<b>死灵法师的诅咒</b>漩涡'),
   L('1-й <j>JG</j> — когда плащ босса «сжимается»','1st <j>JG</j> — when the boss’s cloak “tightens”','第1次<j>JG</j>——首领披风“收紧”时'),
   L('«Водоросли» режут арену на куски: первым взрывается кусок, появившийся первым — <s>после взрыва уходи в него</s>','“Seaweed” cuts the arena into slices: the first slice drawn explodes first — <s>step into it after it blows</s>','“水草”把场地切成块：最先出现的块最先爆炸——<s>爆炸后走进去</s>'),

   L('Финал: <j>JG</j> босса → <j>JG</j> гроба','Finish: boss <j>JG</j> → coffin <j>JG</j>','收尾：首领<j>JG</j> → 棺材<j>JG</j>'),
   HM('NM: 1-я серия взрывов 5 → 11 → 7 ч, 2-я — случайная','NM: 1st blast series 5 → 11 → 7 o’clock, 2nd is random','噩梦：第1轮爆炸5 → 11 → 7点，第2轮随机'),
   L('С этой полосы начинаются Insight-атаки','Insight attacks start from this bar','从这管开始出现看破攻击'),
 ],fig:[{svg:'seaweed',cap:L('NM: порядок взрывов','NM: blast order','噩梦：爆炸顺序')}]},
 {n:'!',t:L('Красные атаки','Red Attacks','红色攻击'),items:[

const pt=(cx,cy,r,h)=>{const a=h*Math.PI/6;return [cx+r*Math.sin(a),cy-r*Math.cos(a)];};
function sector(cx,cy,r,h1,h2){const [x1,y1]=pt(cx,cy,r,h1),[x2,y2]=pt(cx,cy,r,h2);return `M${cx},${cy}L${x1.toFixed(1)},${y1.toFixed(1)}A${r},${r} 0 0 1 ${x2.toFixed(1)},${y2.toFixed(1)}Z`;}
const RED='#c8323f',SAFE='#3f9f6e';
function clockTicks(cx,cy,r,c='#6b6276'){let s='';for(let h=0;h<12;h++){const[a,b]=pt(cx,cy,r,h),[e,f]=pt(cx,cy,r-6,h);s+=`<line x1="${a}" y1="${b}" x2="${e}" y2="${f}" stroke="${c}" stroke-width="2"/>`;}return s;}
const SVG={
 pizza(){let s=`<svg class="dg" viewBox="0 0 200 128"><rect width="200" height="128" rx="6" fill="#120f16"/>`;
   const cx=100,cy=64,r=56;
   for(let i=0;i<8;i++){const h=i*1.5;s+=`<path d="${sector(cx,cy,r,h,h+1.5)}" fill="${i==3?SAFE:RED}" opacity="${i==3?.95:.78}" stroke="#120f16" stroke-width="2"/>`;}
   s+=`<circle cx="${cx}" cy="${cy}" r="9" fill="#2a2430" stroke="#e8dccb" stroke-width="2"/>`;
   const[a,b]=pt(cx,cy,r*.62,5.25);s+=`<text x="${a}" y="${b+5}" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">✓</text></svg>`;return s;},
 seaweed(){let s=`<svg class="dg" viewBox="0 0 200 150"><rect width="200" height="150" rx="6" fill="#120f16"/>`;const cx=100,cy=75,r=62;
   s+=`<circle cx="${cx}" cy="${cy}" r="${r+6}" fill="none" stroke="#7e6bd6" stroke-width="4" stroke-dasharray="3 5" opacity=".7"/>`;
   const order={5:1,11:2,7:3};
   for(let h=0;h<12;h++){const o=order[h];s+=`<path d="${sector(cx,cy,r,h-.5,h+.5)}" fill="${o?RED:'#2a2430'}" opacity="${o?(1.05-o*.18):.9}" stroke="#120f16" stroke-width="1.5"/>`;}
   for(const h in order){const[a,b]=pt(cx,cy,r*.7,+h);s+=`<circle cx="${a}" cy="${b}" r="10" fill="#120f16" stroke="#fff" stroke-width="1.5"/><text x="${a}" y="${b+4.5}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="Oswald">${order[h]}</text>`;}
   s+=clockTicks(cx,cy,r);s+=`<circle cx="${cx}" cy="${cy}" r="8" fill="#a98bff"/></svg>`;return s;},
 clones(){let s=`<svg class="dg" viewBox="0 0 200 150"><rect width="200" height="150" rx="6" fill="#120f16"/>`;const cx=100,cy=75,r=60;
   s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#1f1a26" stroke="#4b4256" stroke-width="2"/>`+clockTicks(cx,cy,r);
   const U=[[6,'#a98bff',13],[1,'#7fb2ff',10],[11,'#7fb2ff',10]];
   for(const[h,c,rr] of U){const[a,b]=pt(cx,cy,r*.68,h);s+=`<circle cx="${a}" cy="${b}" r="${rr}" fill="${c}" stroke="#fff" stroke-width="1.5"/>`;
     s+=`<rect x="${a-16}" y="${b+(h==6?-26:15)}" width="32" height="5" rx="2" fill="#3a3342"/><rect x="${a-16}" y="${b+(h==6?-26:15)}" width="6" height="5" rx="2" fill="#f2d15c"/>`;
     s+=`<text x="${a}" y="${b+4}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#120f16" font-family="Oswald">${h}</text>`;}
   s+=`<text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="12" font-weight="600" fill="#f2d15c" font-family="Oswald">~7 s</text></svg>`;return s;},
 ritual(){let s=`<svg class="dg" viewBox="0 0 250 190"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5fc6ff"/></marker></defs><rect width="250" height="190" rx="6" fill="#120f16"/>`;
   const cx=125,cy=97,r=74;
   s+=`<path d="M${cx},${cy-r-6}A${r+6},${r+6} 0 0 0 ${cx},${cy+r+6}" fill="none" stroke="#66d29e" stroke-width="3" opacity=".55"/>`;
   s+=`<path d="M${cx},${cy-r-6}A${r+6},${r+6} 0 0 1 ${cx},${cy+r+6}" fill="none" stroke="#66d29e" stroke-width="3" opacity=".55" stroke-dasharray="6 4"/>`;
   s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#2a1418" stroke="#6b2f35" stroke-width="2"/>`;
   const arrow=(h1,h2)=>{const[a,b]=pt(cx,cy,r*.66,h1),[c,d]=pt(cx,cy,r*.62,h2);const mx=(a+c)/2+(cx-(a+c)/2)*.35,my=(b+d)/2+(cy-(b+d)/2)*.35;return `<path d="M${a},${b}Q${mx},${my} ${c},${d}" fill="none" stroke="#5fc6ff" stroke-width="1.8" marker-end="url(#ah)" opacity=".9"/>`;};
   s+=arrow(7,9)+arrow(7,12)+arrow(1,3)+arrow(1,6);
   for(const h of [3,6,9,12]){const[a,b]=pt(cx,cy,r*.74,h);s+=`<rect x="${a-11}" y="${b-11}" width="22" height="22" rx="4" fill="#d4a85a" stroke="#fff" stroke-width="1.2"/><text x="${a}" y="${b+4.5}" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1408" font-family="Oswald">${h}</text>`;}
   for(const h of [1,7]){const[a,b]=pt(cx,cy,r*.74,h);s+=`<circle cx="${a}" cy="${b}" r="10" fill="#5fc6ff" stroke="#fff" stroke-width="1.2"/><text x="${a}" y="${b+4.5}" text-anchor="middle" font-size="12" font-weight="700" fill="#06202e" font-family="Oswald">${h}</text>`;}
   s+=`<circle cx="${cx}" cy="${cy}" r="12" fill="#e0614f" stroke="#fff" stroke-width="1.5"/>`;
   s+=`<text x="16" y="24" font-size="13" font-weight="700" fill="#66d29e" font-family="Oswald">P1</text><text x="234" y="24" text-anchor="end" font-size="13" font-weight="700" fill="#66d29e" font-family="Oswald">P2</text></svg>`;return s;},
};
/* Time Attack grids: 7×7 seen as a diamond, coffins along the two upper edges (after Inven’s diagrams) */
function taGrid(fn,counter){const N=7,c=11;let cells='';
  for(let r=0;r<N;r++)for(let q=0;q<N;q++){const v=fn(r,q);cells+=`<rect x="${q*c}" y="${r*c}" width="${c-1.2}" height="${c-1.2}" fill="${v==2?'#ff3b4a':v==1?'#b52733':'#3a3442'}"/>`;}
  let cof='';for(let i=0;i<N;i++){cof+=`<rect x="${i*c+2}" y="-9" width="${c-4}" height="6" rx="2" fill="${counter?'#5fc6ff':'#6b4f9a'}"/><rect x="-9" y="${i*c+2}" width="6" height="${c-4}" rx="2" fill="#6b4f9a"/>`;}
  return `<svg class="dg" viewBox="0 0 120 92"><rect width="120" height="92" rx="6" fill="#120f16"/><g transform="translate(60,10) scale(1,.72) rotate(45)">${cof}${cells}</g></svg>`;}
SVG.taV=()=>taGrid((r,q)=>(r>=4||q>=4)?((r==4&&q<4)||(q==4&&r<4)?2:1):0);
SVG.taC=()=>taGrid((r,q)=>r==0?1:0,true);
SVG.taW=()=>taGrid((r,q)=>((r==0||r==6)&&(q==0||q==6))?0:(r%2==1&&q%2==1)?0:1);
SVG.taL=()=>taGrid((r,q)=>r<=1?1:r==2?2:0);

function items(g){const L2=ITEMS[g===1?'g1':'g2'];
  return `<div class="items"><div class="ih">${tx(ITEMS.head)}<small>${tx(ITEMS.note)}</small></div>`+
   L2.map(i=>`<div class="it${i.opt?' opt':''}"><div class="ic">${i.img?`<img src="${i.img}" alt="">`:i.ic}</div><div><b>${tx(i.n)}</b><span>${tx(i.u)}</span></div></div>`).join('')+`</div>`;}

/* ---------------- render ---------------- */
let LG='ru';
const tx=o=>o==null?'':typeof o==='string'?o:(o[LG]??o.ru);
const ICON_FM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20 15 9M14 4l6 6M5 15l4 4M17 3l4 4-2 2-4-4z"/></svg>';
function li(b){const sub=b.sub?`<ul>${b.sub.map(li).join('')}</ul>`:'';return `<li${b.c?` class="${b.c}"`:''}>${tx(b)}${sub}</li>`;}
function fig(f){const inner=f.svg?SVG[f.svg]():`<img src="${f.img}" alt="${tx(f.cap)}" loading="eager">`;return `<figure>${inner}<figcaption>${tx(f.cap)}</figcaption></figure>`;}
function sec(s){
  const num=s.n==='fm'?ICON_FM:s.n==='!'?'<span style="color:var(--death)">!</span>':s.n;
  const h=`<h3>${tx(s.t)}${s.tag?`<span class="tag">${tx(s.tag)}</span>`:''}${s.ko?`<span class="ko" lang="ko">${s.ko}</span>`:''}</h3>`;
  const list=`<ul>${s.items.map(li).join('')}</ul>`;
  let body;
  if(s.figRow) body=`<div class="txt">${list}</div></div><div class="dgrow" style="margin-top:8px">${s.fig.map(fig).join('')}`;
  else body=`<div class="txt">${list}</div>${s.fig?`<div class="fig${s.n==='360'?' w':''}">${s.fig.map(fig).join('')}</div>`:''}`;
  return `<section class="sec"><div class="num">${num}</div>${h}<div class="body">${body}</div></section>`;
}
const fmt=n=>n.toLocaleString(LG==='zh'?'zh-CN':LG==='en'?'en-US':'ru-RU');
const HP={N:[1739316795458,1950577229952],H:[2768565114395,3133977387540],NM:[4951627226525,5605114847754]};
const GOLD={N:50000,H:62000,NM:75000};
function gate(g){
  const one=g===1,cls=one?'g1':'g2';
  const hp=['N','H','NM'].map(d=>`<i>${d} · ${fmt(HP[d][g-1])}</i>`).join('');
  const lbls=one?[['300','240'],['195','0']]:[['360','320'],['300','0']];
  const orn=`<div class="orn"><span class="ln"></span><span class="lbl">${tx(UI.gate)} ${one?'I':'II'} · <em>${lbls[0][0]}</em> → ${lbls[0][1]}</span><span class="dia"></span><span class="lbl"><em>${lbls[1][0]}</em> → ${lbls[1][1]}</span><span class="ln"></span></div>`;
  const A=one?G1A:G2A,B=one?G1B:G2B;
  return `<div class="${cls}">
   <div class="ghead"><div class="gbadge"><span>G${g}<small>${one?'10:00':'13:00'}</small></span></div>
     <div><div class="gname">${tx(one?UI.g1name:UI.g2name)}</div>
     <div class="gtags">${tx(one?UI.g1place:UI.g2place)} · ${tx(one?UI.g1tags:UI.g2tags)}</div>
     <div class="ghp">${hp}</div></div></div>
   ${orn}
   ${items(g)}
   <div class="cols"><div class="col">${A.map(sec).join('')}</div><div class="col">${B.map(sec).join('')}</div></div></div>`;
}
const LOCK='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0-6 6v4h12V9a6 6 0 0 0-6-6z"/><rect x="4" y="12" width="16" height="9" rx="2"/></svg>';
function render(){
  document.documentElement.lang=LG==='zh'?'zh-CN':LG;
  const D=[['n',1750,'N'],['h',1770,'H'],['nm',1780,'NM']].map(([k,il,G])=>`<div class="diff d-${k}">${LOCK}<span class="n">${tx(UI.diff[k])}</span><span class="il">${il}</span><span class="gd"><b>${fmt(GOLD[G])}</b><br>${tx(UI.gold)}</span></div>`).join('');
  document.getElementById('sheet').innerHTML=`
   <header class="top"><div class="kick">${tx(UI.kick)}</div><h1>${tx(UI.title)}</h1><div class="diffs">${D}</div></header>
   <div class="gates">${gate(1)}${gate(2)}</div>
   <footer class="foot"><div class="legend">${UI.legend.map(([c,l])=>`<span><i style="background:${c}"></i>${tx(l)}</span>`).join('')}</div>
     <div class="mid">${tx(UI.src)}</div><div class="cr">${tx(UI.credit)}</div></footer>`;
  document.getElementById('bar').innerHTML=`<a href="../index.html?lang=${LG}">${tx(UI.back)}</a><span class="sp"></span>`+
    [['ru','RU'],['en','EN'],['zh','中文']].map(([l,n])=>`<button type="button" data-l="${l}" aria-pressed="${l===LG}">${n}</button>`).join('')+
    `<span class="sp"></span><button type="button" class="zm" aria-pressed="${FIT}">${tx(FIT?UI.fit:UI.full)}</button>`+
    `<a href="belgardin-cheatsheet-${LG}.png" download>${tx(UI.save)}</a>`;
  document.querySelector('.bar .zm').onclick=()=>{FIT=!FIT;try{localStorage.setItem('belg_cs_fit',FIT?'1':'0');}catch(e){}render();};
  fit();
  document.querySelectorAll('.bar button[data-l]').forEach(b=>b.onclick=()=>{LG=b.dataset.l;try{localStorage.setItem('belg_lang',LG);}catch(e){}history.replaceState(null,'','?lang='+LG);render();});
}
/* fit-to-width: scale the 2400px sheet down to the viewport (1:1 keeps native size with horizontal scroll) */
let FIT=true;try{FIT=localStorage.getItem('belg_cs_fit')!=='0';}catch(e){}
function fit(){
  const sh=document.getElementById('sheet'),k=FIT&&!document.documentElement.classList.contains('print')?Math.min(1,document.documentElement.clientWidth/2400):1;
  sh.style.zoom=k===1?'':k;
}
addEventListener('resize',fit);
(function init(){
  const p=new URLSearchParams(location.search);let q=(p.get('lang')||'').toLowerCase();if(q==='cn')q='zh';
  if(!/^(ru|en|zh)$/.test(q)){try{q=localStorage.getItem('belg_lang')||'';}catch(e){}}
  if(!/^(ru|en|zh)$/.test(q)){const n=(navigator.language||'ru').toLowerCase();q=n.startsWith('zh')?'zh':/^(ru|uk|be|kk)/.test(n)?'ru':'en';}
  LG=q;if(p.has('print'))document.documentElement.classList.add('print');render();
})();
